<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b120e"/>
      <stop offset="55%" stop-color="#0e1a13"/>
      <stop offset="100%" stop-color="#0a0f0c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <ellipse cx="600" cy="230" rx="520" ry="180" fill="url(#glow)"/>

  <!-- faint price curve: Gaussian CDF, the protocol's price surface -->
  <path d="M 60 210 C 200 208, 380 206, 600 150 C 820 94, 1000 92, 1140 90"
        fill="none" stroke="#34D399" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="600" cy="150" r="5" fill="#34D399"/>
  <line x1="600" y1="150" x2="600" y2="238" stroke="#34D399" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="60" y1="238" x2="1140" y2="238" stroke="#34D399" stroke-opacity="0.3" stroke-width="1"/>
  <text x="600" y="262" fill="#6ee7b7" fill-opacity="0.55" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">P = Φ((y − x) / L)</text>

  <text x="600" y="110" fill="#e7f5ee" font-family="Georgia, serif" font-size="62" font-weight="700" text-anchor="middle" letter-spacing="6">CAP TABLE</text>
  <rect x="472" y="128" width="256" height="3" fill="url(#accent)" rx="1.5"/>

  <text x="600" y="165" fill="#9fb8ab" font-family="ui-monospace, monospace" font-size="19" text-anchor="middle" letter-spacing="1">a compliance-aware secondary market for ATS securities</text>
  <text x="600" y="192" fill="#5f7a6e" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle" letter-spacing="1">Uniswap Continuous Clearing Auction · Hedera testnet · chain id 296</text>
</svg>
